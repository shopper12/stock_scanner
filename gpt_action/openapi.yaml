openapi: 3.1.0
info:
  title: Stock Scanner Action API
  version: 1.0.0
  description: Save structured recommendation records into stock_scanner history and notify Telegram.
servers:
  - url: https://YOUR_PUBLIC_API_HOST
paths:
  /api/chatgpt-picks:
    post:
      operationId: saveChatGptPicks
      summary: Save recommendation records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                source:
                  type: string
                  enum: [custom_gpt, chatgpt, manual]
                  default: custom_gpt
                notify:
                  type: boolean
                  default: true
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required:
                      - code
                      - name
                    properties:
                      id:
                        type: string
                      recommended_at_kst:
                        type: string
                      code:
                        type: string
                      name:
                        type: string
                      market:
                        type: string
                        default: KRX
                      sector:
                        type: string
                      strategy_type:
                        type: string
                      current_price:
                        type: number
                      entry:
                        type: number
                      entry_low:
                        type: number
                      entry_high:
                        type: number
                      stop_loss:
                        type: number
                      target1:
                        type: number
                      target2:
                        type: number
                      rationale:
                        type: string
                      risk:
                        type: string
                      source_note:
                        type: string
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  saved_count:
                    type: integer
                  notified:
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                        source_id:
                          type: string
        '400':
          description: Bad request
