services:
  - type: web
    name: stock-scanner-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python api_server.py
    envVars:
      - key: USE_MOCK_DATA
        value: "0"
      - key: ALLOW_DATA_FALLBACK
        value: "0"
      - key: TIMEZONE
        value: Asia/Seoul
