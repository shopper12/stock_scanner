name: Update Chat Trade Prices

on:
  workflow_dispatch:
    inputs:
      include_closed:
        description: "Also update closed trades"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "30 0 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Update current prices
        run: |
          if [ "${{ github.event.inputs.include_closed }}" = "true" ]; then
            python tools/update_chat_trade_prices.py --include-closed --git-push
          else
            python tools/update_chat_trade_prices.py --git-push
          fi
