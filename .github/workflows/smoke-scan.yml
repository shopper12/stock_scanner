name: Smoke Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke scan
        env:
          USE_MOCK_DATA: '0'
          ALLOW_DATA_FALLBACK: '0'
          TIMEZONE: Asia/Seoul
        run: |
          python tools/smoke_scan.py

      - name: Upload quote quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-quality-report
          path: reports/quote_quality_latest.json
          if-no-files-found: ignore
