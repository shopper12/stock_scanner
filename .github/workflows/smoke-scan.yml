name: Smoke Scan

on:
  workflow_dispatch:
    inputs:
      commit_report:
        description: 'Commit reports/latest.json after scan'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: stock-smoke-scan
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke scan
        env:
          USE_MOCK_DATA: '0'
          ALLOW_DATA_FALLBACK: '0'
          TIMEZONE: Asia/Seoul
        run: python tools/smoke_scan.py

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-reports
          path: |
            reports/latest.json
            reports/quote_quality_latest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit latest report
        if: ${{ github.event.inputs.commit_report == 'true' }}
        run: |
          if [ ! -f reports/latest.json ]; then
            echo "reports/latest.json not found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json reports/quote_quality_latest.json
          if git diff --cached --quiet; then
            echo "No scan report changes"
          else
            git commit -m "Update latest scan report"
            git push
          fi
