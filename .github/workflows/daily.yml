name: Daily scanner smoke run

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'  # 07:30 KST

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scan_once.py
        env:
          USE_MOCK_DATA: '1'
