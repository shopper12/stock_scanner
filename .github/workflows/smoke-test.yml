name: Stock Scanner Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode:
          - mock
          - live

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke scan
        env:
          USE_MOCK_DATA: ${{ matrix.mode == 'mock' && '1' || '0' }}
          TIMEZONE: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          TELEGRAM_CHAT_IDS: ''
        run: python tools/smoke_scan.py
