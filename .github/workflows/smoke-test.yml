name: Stock Scanner Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Data mode'
        required: false
        default: 'mock'
        type: choice
        options:
          - mock
          - live

concurrency:
  group: stock-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke scan
        env:
          USE_MOCK_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live' && '0' || '1' }}
          ALLOW_DATA_FALLBACK: '1'
          TIMEZONE: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          TELEGRAM_CHAT_IDS: ''
        run: python tools/smoke_scan.py
