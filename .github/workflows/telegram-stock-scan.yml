name: Telegram Stock Scanner

on:
  workflow_dispatch:
  schedule:
    # KRX regular session window: 09:00-15:45 KST = 00:00-06:45 UTC, weekdays
    - cron: '*/15 0-6 * * 1-5'
    # Off-hours heartbeat: every hour
    - cron: '5 7-23 * * *'

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_MOCK_DATA: ${{ vars.USE_MOCK_DATA || 'true' }}
          TIMEZONE: Asia/Seoul
        run: python scan_once.py --notify
