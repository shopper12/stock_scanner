name: KR Short Rule Check

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply accepted rule update'
        required: false
        default: 'false'
      ai_review:
        description: 'Use Gemini report review when configured'
        required: false
        default: 'false'
  schedule:
    - cron: '10 8 * * 0'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rule check
        env:
          USE_MOCK_DATA: '0'
          TIMEZONE: Asia/Seoul
          GEMINI_ENABLED: ${{ github.event.inputs.ai_review || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python tools/kr_short_check.py --apply
          else
            python tools/kr_short_check.py
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr-short-report
          path: reports/kr_short_evolution_latest.json
          if-no-files-found: ignore

      - name: Commit accepted update
        run: |
          if git diff --quiet; then
            echo "No accepted rule update"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rules/kr_short_rules.json reports/kr_short_evolution_latest.json
            git commit -m "Update KR short rules from rule check"
            git push
          fi
