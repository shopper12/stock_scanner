name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stock-scanner-upload.jks"

      - name: Patch release build metadata and update link
        run: |
          python - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode = 3', 'versionCode = 4')
          text = text.replace('versionName = "1.2"', 'versionName = "1.3"')
          gradle.write_text(text, encoding='utf-8')

          main = Path('app/src/main/java/com/stockscanner/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              'https://github.com/shopper12/stock_scanner/actions/workflows/android-build.yml',
              'https://github.com/shopper12/stock_scanner/releases/tag/app-latest',
          )
          text = text.replace(
              "업데이트 방식: GitHub 수정 후 Android Build가 자동 실행됩니다. '업데이트/APK' 버튼을 누르고 최신 성공 빌드의 stock-scanner-debug-apk를 내려받아 설치하세요.",
              "업데이트 방식: GitHub 수정 후 Android Build가 자동 실행되고, 최신 서명 APK가 app-latest Release에 올라갑니다. '업데이트/APK' 버튼을 누른 뒤 stock-scanner-latest.apk를 받아 설치하세요.",
          )
          main.write_text(text, encoding='utf-8')
          PY

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/stock-scanner-upload.jks
        run: sh ./gradlew :app:assembleRelease

      - name: Prepare latest APK assets
        run: |
          VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/*.apk stock-scanner-latest.apk
          cat > app_version.json <<EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}",
            "apk_url": "https://github.com/shopper12/stock_scanner/releases/download/app-latest/stock-scanner-latest.apk",
            "built_at_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit_sha": "${GITHUB_SHA}"
          }
          EOF
          cat app_version.json

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-release-apk
          path: stock-scanner-latest.apk
          if-no-files-found: error

      - name: Publish latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f app-latest
          git push -f origin app-latest
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest stock-scanner-latest.apk app_version.json --clobber
            gh release edit app-latest --title "Stock Scanner Latest" --notes "Latest signed release APK built from ${GITHUB_SHA}."
          else
            gh release create app-latest stock-scanner-latest.apk app_version.json --title "Stock Scanner Latest" --notes "Latest signed release APK built from ${GITHUB_SHA}."
          fi
